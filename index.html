<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Wheee!ekend" />
  <meta name="application-name" content="Wheee!ekend" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="referrer" content="no-referrer-when-downgrade" />
  <meta name="theme-color" content="#F4F2EC" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#12161C" media="(prefers-color-scheme: dark)" />
  <title>Wheee!ekend — Прогулки по Москве и Подмосковью</title>
  <meta name="description" content="Персональные прогулки по Москве и Подмосковью: отмечайте места, где уже были, и получайте маршруты с дворами, выставками и парками. Работает офлайн и помнит ваши отметки." />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon-32.png" sizes="32x32" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script>
    (function () {
      try {
        var theme = localStorage.getItem("wheee_theme") || "auto";
        if (theme === "light" || theme === "dark") {
          document.documentElement.setAttribute("data-theme", theme);
        }
      } catch (e) {}
    })();
  </script>
  <script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU" type="text/javascript"></script>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="offlineBanner" class="offline-banner" role="status" hidden>
    <span class="offline-banner-icon" data-icon="i-wifi-off"></span>
    <span>
      <strong>Нет сети — всё работает</strong>
      <span>Маршруты собираем из сохранённой базы. Отметки отправим, когда появится интернет.</span>
    </span>
  </div>

  <div id="appRoot" class="app-column">
    <main id="screenRoot" class="screen-root"></main>
    <nav id="tabBar" class="tabbar" aria-label="Основная навигация" hidden>
      <button type="button" class="tabbar-item" data-tab="walks">
        <span data-icon="i-walks"></span><span>Прогулки</span>
      </button>
      <button type="button" class="tabbar-item" data-tab="favorites">
        <span data-icon="i-heart"></span><span>Избранное</span>
      </button>
      <button type="button" class="tabbar-item" data-tab="memory">
        <span data-icon="i-memory"></span><span>Память</span>
      </button>
      <button type="button" class="tabbar-item" data-tab="more">
        <span data-icon="i-menu"></span><span>Ещё</span>
      </button>
    </nav>
  </div>

  <div id="sheetRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>

  <script src="firebase-config.js"></script>
  <script src="cloud.js"></script>
  <script src="offline_engine.js"></script>
  <script src="app.js"></script>
  <script src="screens.js"></script>
</body>
</html>
