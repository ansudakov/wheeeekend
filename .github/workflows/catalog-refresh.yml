name: Publish PWA and refresh catalogue

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        if: github.event_name != 'push'
        with:
          node-version: 22
      - name: Refresh catalogue without user data
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          ln -s .. .catalog/public
          trap 'rm -f .catalog/public' EXIT
          node .catalog/scripts/sync_moscow_live.js
      - name: Save updated public catalogue
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Wheeeekend catalogue'
          git config user.email 'catalogue@users.noreply.github.com'
          git add places_bundle.json .catalog/data/live_moscow_db.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public places catalogue'
            git push origin HEAD:main
          fi
      - name: Prepare public-only Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          site_dir="$RUNNER_TEMP/wheee-pages"
          mkdir -p "$site_dir"
          cp index.html styles.css tokens.css app.js screens.js offline_engine.js cloud.js firebase-config.js sw.js manifest.json places_bundle.json "$site_dir/"
          cp -- *.svg *.png "$site_dir/"
          cp -R photos fonts vendor "$site_dir/"
          touch "$site_dir/.nojekyll"
          if [ -f CNAME ]; then cp CNAME "$site_dir/"; fi
          if [ -n "$(find "$site_dir" -type l -print -quit)" ]; then
            echo 'Pages artifact must not contain symbolic links' >&2
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/wheee-pages
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
